[project]
name = "parakeet-coreml-scripts"
version = "0.1.0"
description = "Utility scripts for converting and spot-checking Parakeet CoreML models"
requires-python = ">=3.10"
dependencies = [
    "coremltools>=8.0",
    "numpy",
    "soundfile",
    "typer",
    # PyObjC for native CoreML inference with ANE/GPU dispatch (macOS only)
    "pyobjc-core",
    "pyobjc-framework-CoreML",
    "pyobjc-framework-Cocoa",
]

[tool.uv]
no-build-package = ["parakeet-coreml-scripts"]
